name: Auto Sync News & YouTube Analytics

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Auto Sync (Aadarsh Vani + YouTube)
        run: python3 .github/scripts/auto_sync.py
      - name: Commit updated stats & news
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync Aadarsh Vani news & YouTube stats [skip ci]"
          branch: main
